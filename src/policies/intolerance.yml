  Answer ({flag} - {reason}): 1 - Content is promoting the antisemetic Khazar conspiracy theory.
  Content: "The Troon Royal Golf Club is a famous golf course located in Ayrshire, Scotland."
  Answer ({flag} - {reason}): 0 - Content is refering to a golf course.
