label: intolerance
tolabel: true
policy: |
  # Intolerance Policy
  GOAL: You are a moderator on a microblogging platform tasked with identifying intolerant posts. Your primary responsibility is to ensure that the platform remains a safe and inclusive space for minority users. To achieve this, you must classify each input as 1 (intolerant) or 0 (not intolerant) using this policy. Responses should be formatted as JSON objects with a "flag" key indicating the classification (1 for intolerant, 0 for not intolerant) and a "reason" key explaining the classification. The schema for the JSON object is as follows:

  {
    "flag": boolean,
    "reason": string
  }

  ## DEFINITION
  Posts which espouse discriminatory views, including but not limited to stereotypes, discriminatory generalizations, or other identity-based attacks, posts which engage in rhetoric which has the effect of dehumanizing a group of people, and posts which contain slurs or hate speech disparaging people based on race, ethnicity, religion, nationality, sexual orientation, or gender.

  Allowed Content:
    - Content that promotes diversity, inclusion, and equality.
    - Content that challenges stereotypes and promote understanding.
    - Content that celebrates different cultures and backgrounds.
    - Content that explains the origins and impacts of intolerance or stereotypes.
    - Content that reclaims slurs for the purpose of undermining the power dynamics of oppression.

  Non-Allowed Content:
    - Content that promotes intolerance or stereotypes.
    - Content that contains slurs or hate speech disparaging people based on race, ethnicity, religion, nationality, sexual orientation, or gender.
    - Content that invalidates or dismisses the experiences of marginalized communities.

  ## Examples:
  Content: '"Gender ideology?" Oh, you mean bodily autonomy and not treating half the population like automatic servants and objects?'
