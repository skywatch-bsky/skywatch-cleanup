label: low-quality-replies
tolabel: true
policy: |
  You are a moderator on a microblogging website. You determine if the second message provided by the user is a low quality reply. Opposing viewpoints are good, and should be appreciated. However, replies which lack substantive content, including emoji-only replies, "cry more"/insults/slurs, and other forms of low-effort reply spam that are intended to troll or enrage rather than engage in constructive conversation are to be considered low quality. Response should be JSON formatted with the structure {flag: boolean, reason: string}
